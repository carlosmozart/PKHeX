# PKHeX.Modern: pacotes autocontidos para Windows, Linux e macOS.
name: PKHeX.Modern build

on:
  push:
    branches: [ modern-ui ]
    tags: [ 'modern-v*' ]
    paths:
      - 'PKHeX.Modern/**'
      - 'PKHeX.Core/**'
      - 'PKHeX.Modern.Sprites/**'
      - 'PKHeX.Drawing/**'
      - 'PKHeX.Drawing.PokeSprite/**'
      - 'PKHeX.Drawing.Misc/Resources/img/box/**'
      - 'Tools/PKHeX.Modern.Tests/**'
      - 'Tools/package_modern.py'
      - 'Tools/test_package_modern.py'
      - 'icon.png'
      - 'Directory.Build.props'
      - '.github/workflows/modern-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Testar empacotamento
        run: python -B Tools/test_package_modern.py
      - name: Publicar
        run: dotnet publish PKHeX.Modern -p:PublishProfile=${{ matrix.rid }}
      - name: Compactar (bundle e icone no macOS)
        run: python Tools/package_modern.py --rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@v7
        with:
          name: PKHeX.Modern-${{ matrix.rid }}
          path: PKHeX.Modern-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 1

  tests:
    continue-on-error: true # Temporario, ate validar a suite completa nos dois sistemas.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Dependencias do render headless (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libice6 libsm6 libfontconfig1
      - name: Testes headless (SpriteParity so no Windows)
        shell: pwsh
        run: ./Tools/PKHeX.Modern.Tests/run-tests.ps1

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Atualizacao e paridade de sprites
        shell: pwsh
        run: ./Tools/PKHeX.Modern.Tests/run-tests.ps1 Updates SpriteParity

  release:
    if: startsWith(github.ref, 'refs/tags/modern-v')
    needs: [build, windows-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: PKHeX.Modern-*
          merge-multiple: true
          path: packages
      - name: Criar Release com todos os pacotes
        uses: softprops/action-gh-release@v3
        with:
          files: packages/PKHeX.Modern-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
